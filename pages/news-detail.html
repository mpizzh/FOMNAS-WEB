<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Baca berita terbaru dari Forum MPK Nasional.">
  <title>Detail Berita | Forum MPK Nasional</title>
  <link rel="icon" type="image/png" href="/assets/images/fomnas_logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <div class="ambient-bg"></div>
  <header class="header">
    <div class="container">
      <a href="/" class="brand-logo" aria-label="Beranda Forum MPK Nasional">
        <img src="/assets/images/fomnas_logo.png" alt="Forum MPK Nasional" class="logo-img">
        <span class="brand-text">Forum <strong>MPK Nasional</strong></span>
      </a>
      <nav class="nav-pill-wrapper" aria-label="Navigasi Utama">
        <div class="nav-links">
          <a href="/" class="nav-link">Beranda</a>
          <a href="/news" class="nav-link active">News</a>
        </div>
      </nav>
      <a href="/news" class="detail-back-link"><i class="fas fa-arrow-left"></i> Semua Berita</a>
    </div>
  </header>

  <main class="news-detail-page">
    <div class="container">
      <p class="page-breadcrumbs"><a href="/">Beranda</a><span>/</span><a href="/news">News</a><span>/</span><span>Detail</span></p>
      <p id="news-detail-status" class="news-status" role="status" aria-live="polite">Memuat berita...</p>
      <article id="news-article" class="news-article" hidden>
        <header class="news-article-header">
          <h1 id="news-title"></h1>
          <p class="news-article-date"><i class="far fa-calendar-alt" aria-hidden="true"></i> <time id="news-date"></time></p>
        </header>
        <img id="news-image" class="news-article-image" alt="">
        <div id="news-content" class="news-article-content"></div>
      </article>
      <section class="news-related-section" aria-labelledby="related-heading" hidden>
        <h2 id="related-heading" class="section-title">Berita Lainnya</h2>
        <p id="related-status" class="news-status" role="status" aria-live="polite"></p>
        <div id="related-news-grid" class="cards-grid"></div>
      </section>
    </div>
  </main>
  <footer class="news-detail-footer">
    <a href="/news">Kembali ke semua berita</a>
    <p>&copy; 2026 Forum MPK Nasional</p>
  </footer>
  <script src="/assets/js/news-detail.js" defer></script>
</body>
</html>
