<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Login Admin | FOMNAS</title>
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; color: #172033; background: #f3f6fb; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; }
    main { width: min(100%, 420px); padding: 36px; border: 1px solid #e2e8f0; border-radius: 18px; background: #fff; box-shadow: 0 18px 50px #12264a14; }
    h1 { margin: 0 0 8px; font-size: 1.65rem; }
    p { margin: 0 0 26px; color: #64748b; line-height: 1.5; }
    label { display: block; margin: 18px 0 7px; font-weight: 700; font-size: .92rem; }
    input { width: 100%; padding: 12px 13px; border: 1px solid #cbd5e1; border-radius: 9px; font: inherit; }
    input:focus { outline: 3px solid #2563eb26; border-color: #2563eb; }
    button { width: 100%; margin-top: 24px; padding: 13px; border: 0; border-radius: 9px; color: #fff; background: #123b82; font: inherit; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .65; cursor: wait; }
    [role="alert"] { min-height: 1.4em; margin: 15px 0 0; color: #b91c1c; font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <h1>Admin FOMNAS</h1>
    <p>Masuk untuk mengelola berita yang ditampilkan di situs.</p>
    <form id="admin-login-form">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Masuk</button>
      <div id="form-message" role="alert" aria-live="polite"></div>
    </form>
  </main>
  <script src="/assets/js/admin.js" defer></script>
</body>
</html>
